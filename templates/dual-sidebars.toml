# A wide main window flanked by one narrow sidebar on each side (50%/25%/25% width).
# dual-stack-sidebars.toml's shape without the stacking — one window per
# side instead of two.
# Run with, e.g.:
#   sway-launch --template dual-sidebars --apps foot,code,foot
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.
#
# main's width is set in a trailing target_id step, after both sidebars
# already exist, rather than on main's own step right after it launches
# (as sidebar-left.toml/sidebar-right.toml do for their single sidebar).
# Confirmed live this actually matters here: with all three windows as
# flat siblings of the workspace (none of them nested one inside another,
# unlike master-triple-stack.toml's stack, which nests once a third window
# joins), resizing main to 50ppt right after sidebar-right's own step
# still redistributed back to three equal thirds once sidebar-right's step
# itself ran — sway re-flows a flat row's proportions when a new sibling
# joins it, discarding an earlier sibling's explicit resize. Resizing main
# only after every sibling already exists avoids this.
#
# Params, each overridable with --param NAME=VALUE or a bindings file's
# [params] table:
#   main-width: the main window's width (default 50ppt)
# A wider main window keeps the sidebars narrow and secondary, e.g.:
#   sway-launch --template dual-sidebars --apps foot,code,foot --param main-width=60ppt

[template]
description = "A wide main window flanked by one narrow sidebar on each side (50%/25%/25% width)."
category = "Master/stack"

[params]
main-width = "50ppt"

[[step]]
slot = "sidebar-left"
split = "h"

[[step]]
slot = "main"

[[step]]
slot = "sidebar-right"

[[step]]
target_id = "main"
width = "{main-width}"
