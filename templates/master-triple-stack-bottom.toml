# One large main window on top, three smaller windows split side by side below it.
# Run with, e.g.:
#   sway-launch --template master-triple-stack-bottom --apps code,foot,foot,foot
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.
#
# Only stack-left gets an explicit split="h" — giving stack-middle its own
# split call too nests it (and stack-right) inside stack-left's half,
# rather than joining a single flat row, producing an uneven column split
# instead of three equal columns (same reasoning as master-triple-stack.toml's
# stack-top, rotated to top/bottom here; confirmed live).
#
# Params, each overridable with --param NAME=VALUE or a bindings file's
# [params] table:
#   stack-height: the stack's height (default 30ppt)

[template]
description = "One large main window on top, three smaller windows split side by side below it."
category = "Master/stack"

[params]
stack-height = "30ppt"

[[step]]
slot = "main"
split = "v"

[[step]]
slot = "stack-left"
split = "h"
height = "{stack-height}"

[[step]]
slot = "stack-middle"

[[step]]
slot = "stack-right"
