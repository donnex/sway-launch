# Three windows stacked in a single column.
# Only the first window gets an explicit split="v" — giving the second
# window its own split call too nests it (and the third window) inside
# the first window's half, rather than joining a single flat column,
# producing an uneven 360/180/180-style split instead of three equal
# rows (confirmed live; see six-grid.toml's own header comment for the
# same fix, applied there to split="h" instead).
# Run with, e.g.:
#   sway-launch --template triple-column --apps foot,firefox,code
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.

[template]
description = "Three windows stacked in a single column."
category = "Grid"

[[step]]
slot = "top"
split = "v"

[[step]]
slot = "middle"

[[step]]
slot = "bottom"
