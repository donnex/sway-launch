# Two windows stacked in a single column.
# Run with, e.g.:
#   sway-launch --template dual-column --apps foot,firefox
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.

[template]
description = "Two windows stacked in a single column."
category = "Grid"

[[step]]
slot = "top"
split = "v"

[[step]]
slot = "bottom"
