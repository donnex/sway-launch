# One large main window on the left, two smaller windows stacked in a column on the right.
# The general shape behind dev-workspace.
# Run with, e.g.:
#   sway-launch --template master-dual-stack --apps code,foot,foot
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.
#
# The stack's width is set on stack-top rather than main: resizing a
# window is a no-op while it's still the workspace's only window, so the
# first-launched slot (main) can't be resized directly — sizing the second
# slot instead reshapes both, since sway redistributes the space between
# them.
#
# stack-top needs no new_column: sway places a newly launched window to the
# right of the focused one, so on main's splith workspace it already lands
# as the trailing column. A move right there would be a no-op.

[template]
description = "One large main window on the left, two smaller windows stacked in a column on the right."
category = "Master/stack"

[[step]]
slot = "main"
split = "h"

[[step]]
slot = "stack-top"
split = "v"
width = "35ppt"

[[step]]
slot = "stack-bottom"
