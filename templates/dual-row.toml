# Two windows side by side in a single row.
# Run with, e.g.:
#   sway-launch --template dual-row --apps foot,firefox
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.

[template]
description = "Two windows side by side in a single row."
category = "Grid"

[[step]]
slot = "left"
split = "h"

[[step]]
slot = "right"
