# A narrow bar across the top, a wide main window below it.
# Run with, e.g.:
#   sway-launch --template sidebar-top --apps foot,code
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.
#
# Params, each overridable with --param NAME=VALUE or a bindings file's
# [params] table:
#   main-height: the main window's height (default 75ppt)

[template]
description = "A narrow bar across the top, a wide main window below it."
category = "Sidebar"

[params]
main-height = "75ppt"

[[step]]
slot = "topbar"
split = "v"

[[step]]
slot = "main"
height = "{main-height}"
