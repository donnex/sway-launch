# Three windows side by side in a single row.
# Only the first window gets an explicit split="h" — giving the second
# window its own split call too nests it (and the third window) inside
# the first window's half, rather than joining a single flat row,
# producing an uneven 640/320/320-style split instead of three equal
# columns (confirmed live; see six-grid.toml's own header comment for the
# same fix).
# Run with, e.g.:
#   sway-launch --template triple-row --apps foot,firefox,code
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.

[template]
description = "Three windows side by side in a single row."
category = "Grid"

[[step]]
slot = "left"
split = "h"

[[step]]
slot = "middle"

[[step]]
slot = "right"
