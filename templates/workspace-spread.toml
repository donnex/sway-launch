# Three windows, each moved to its own named workspace.
# Run with, e.g.:
#   sway-launch --template workspace-spread --apps foot,firefox,code
# or via a --bindings file, where a binding's `workspace` replaces the
# step's 1/2/3; see README.md's "Templates" section.

[template]
description = "Three windows, each moved to its own named workspace."
category = "Multi-workspace/output"

[[step]]
slot = "first"
workspace = "1"

[[step]]
slot = "second"
workspace = "2"

[[step]]
slot = "third"
workspace = "3"
