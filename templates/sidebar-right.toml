# A wide main window on the left, a narrow sidebar on the right.
# Run with, e.g.:
#   sway-launch --template sidebar-right --apps code,thunar
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.
#
# Params, each overridable with --param NAME=VALUE or a bindings file's
# [params] table:
#   sidebar-width: the sidebar's width (default 25ppt)

[template]
description = "A wide main window on the left, a narrow sidebar on the right."
category = "Sidebar"

[params]
sidebar-width = "25ppt"

[[step]]
slot = "main"
split = "h"

[[step]]
slot = "sidebar"
width = "{sidebar-width}"
