# The app-agnostic version of examples/layouts/quad-terminals.toml's shape.
# An equally sized 2x2 grid, two rows of two, with no application baked in.
# Run with, e.g.:
#   sway-launch --template templates/quad-grid.toml --apps foot,firefox,code,thunar
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.

[[step]]
slot = "top-left"
split = "h"

[[step]]
slot = "top-right"
split = "v"

[[step]]
slot = "bottom-left"
new_row = true
split = "h"

[[step]]
slot = "bottom-right"
