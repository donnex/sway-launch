# One large main window on the left, three smaller windows stacked in a column on the right.
# Run with, e.g.:
#   sway-launch --template master-triple-stack --apps code,foot,foot,foot
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.
#
# The stack's width is set on stack-top rather than main: resizing a
# window is a no-op while it's still the workspace's only window, so the
# first-launched slot (main) can't be resized directly — sizing the second
# slot instead reshapes both, since sway redistributes the space between
# them.
#
# Only stack-top gets an explicit split="v" — giving stack-middle its own
# split call too nests it (and stack-bottom) inside stack-top's half,
# rather than joining a single flat column, producing an uneven
# 360/180/180-style stack instead of three equal rows (confirmed live;
# see six-grid.toml's own header comment for the same fix).

[[step]]
slot = "main"
split = "h"

[[step]]
slot = "stack-top"
new_column = true
split = "v"
width = "30ppt"

[[step]]
slot = "stack-middle"

[[step]]
slot = "stack-bottom"
