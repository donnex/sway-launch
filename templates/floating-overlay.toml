# A tiled main window, with a small floating window on top of it.
# Run with, e.g.:
#   sway-launch --template floating-overlay --apps code,foot
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.
#
# position = "center" was added to overlay so it lands somewhere
# deterministic every run — without it, overlay landed wherever Sway's own
# default floating placement happened to put it, the one shape in this
# library whose final geometry wasn't fully reproducible run to run.

[[step]]
slot = "main"

[[step]]
slot = "overlay"
floating = true
width = "700px"
height = "450px"
position = "center"
