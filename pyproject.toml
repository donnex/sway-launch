# Not the product: this project exists only so uv can pin the dev tools
# (black, ruff) for scripts/generate-layout-screenshots. It is never built
# or released, and its version is deliberately not kept in step with the
# crate's Cargo.toml version, which is the one releases are tagged from.
[project]
name = "sway-launch-maintainer-tools"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ruff>=0.17.1",
]

[tool.uv]
default-groups = []

[tool.black]
target-version = ["py311"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "C90", # mccabe
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "G",   # flake8-logging-format
    "I",   # isort
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "UP036", # outdated-version-block — the sys.version_info guard here is a
    # runtime UX check (a friendly error for a too-old interpreter actually
    # running the script), not dead code implied by requires-python, which
    # only documents the minimum, never enforces it at runtime.
]

[tool.ruff.lint.pylint]
max-args = 6 # generate_screenshot()'s 6 plain config values don't warrant
# bundling into a dataclass for a single maintainer script this size.
