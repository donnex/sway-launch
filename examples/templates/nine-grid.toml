# An equally sized 3x3 grid, three rows of three, with no application baked in.
# The same shape-extension idea as quad-grid.toml, one row taller. Only
# the first window of each row gets an explicit split="h" — giving every
# column its own split call instead nests each new window inside the
# previous one's half rather than joining a single flat row, producing an
# uneven 640/320/320-style split instead of three equal columns (confirmed
# live — this file previously did exactly that, despite the "equally
# sized" claim above).
# Run with, e.g.:
#   sway-launch --template examples/templates/nine-grid.toml \
#     --apps foot,firefox,code,thunar,chromium,foot,foot,foot,foot
# or with per-slot app_id/class matching via a --bindings file; see
# README.md's "Templates" section.

[[step]]
slot = "top-left"
split = "h"

[[step]]
slot = "top-middle"

[[step]]
slot = "top-right"

[[step]]
slot = "middle-left"
new_row = true
split = "h"

[[step]]
slot = "middle-middle"

[[step]]
slot = "middle-right"

[[step]]
slot = "bottom-left"
new_row = true
split = "h"

[[step]]
slot = "bottom-middle"

[[step]]
slot = "bottom-right"
