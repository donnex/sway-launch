[package]
name = "sway-launch"
version = "0.1.0"
edition = "2021"
description = "Launch an application, wait for its Sway window, then run follow-up actions against it"
license = "BSD-3-Clause"
repository = "https://github.com/donnex/sway-launch"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
swayipc = "4.0.0"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6"
regex = "1.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
include_dir = "0.7.4"

[features]
live-sway-tests = []
