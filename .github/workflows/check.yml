name: Check

# Runs on every push and pull request: formatting, lint, the full test
# suite, and a dependency security audit must all pass before a change is
# considered clean, matching the checks CLAUDE.md requires before a commit.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

  lint-scripts-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck and shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: shellcheck
        run: shellcheck --shell=sh scripts/run-live-sway-tests examples/scripts/*

      - name: shfmt
        run: shfmt -i 2 -d scripts/run-live-sway-tests examples/scripts/*

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint README.md CLAUDE.md docs/*.md

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: black --check
        run: uv run black --check scripts/generate-layout-screenshots

      - name: ruff check
        run: uv run ruff check scripts/generate-layout-screenshots

  live-sway-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install sway and foot
        run: sudo apt-get update && sudo apt-get install -y sway foot

      - name: Run live-Sway tests
        run: ./scripts/run-live-sway-tests

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        uses: actions-rust-lang/audit@v1.2.7
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
