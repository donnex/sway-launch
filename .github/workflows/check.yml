name: Check

# Runs on every push and pull request: formatting, lint, the full test
# suite, and a dependency security audit must all pass before a change is
# considered clean, matching the checks CLAUDE.md requires before a commit.
on:
  push:
  pull_request:

# None of these jobs writes anything to the repository -- they check out this
# repo's own code, lint it and test it. Declared here rather than left to the
# repository default, which on a repo created before GitHub changed that
# default (or with it set permissively) hands every job a read/write token it
# has no use for. The audit job below re-declares its own, since it does need
# issues: write. Mirrors release.yml, where the same scoping already applies.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Thresholds are calibrated to this project's actual measured baseline
      # (86.54% regions / 87.46% lines / 91.59% functions as of 2026-09-01),
      # not an arbitrary round number: sway_launch.rs's IPC-touching functions
      # are deliberately exempted from unit-test coverage (see CLAUDE.md's
      # Rust conventions -- they're exercised by tests/live_sway.rs instead,
      # which this job can't run headlessly), so a flat 90%+ target isn't the
      # right bar here the way it might be for a project with no such
      # exemption list. This gate exists to catch a *regression* (new
      # pure-logic code added with no test) against the known baseline, not to
      # enforce an idealized number.
      #
      # --fail-under-functions was lowered from 90 to 88 on 2026-09-01, a
      # deliberate decision rather than a slip. Sharing one connection across
      # the wait-time poll cycle moved poll_matches()'s arms from "incidentally
      # executed while always returning false" to genuinely unreachable without
      # a compositor, taking function coverage from 93.38% to 91.59% and
      # leaving only ~1.6 points of headroom over a 90 gate. The next
      # IPC-touching helper added -- exactly the kind this project exempts on
      # purpose -- would then have failed a threshold that was never meant to
      # constrain it, and the "fix" would have been lowering the gate anyway,
      # under time pressure and looking like a slipped standard.
      #
      # The arithmetic, so this can be re-derived rather than re-guessed: 440
      # functions, 37 currently uncovered. A 90 gate allows 44 uncovered (room
      # for 7 more); 88 allows 52 (room for ~15). Regions and lines keep ~6.5
      # and ~5.5 points of headroom respectively and are unchanged. A 3.6-point
      # function drop would still be a lot of untested pure logic, so the
      # regression signal survives.
      - name: cargo llvm-cov (coverage regression gate, excluding main.rs)
        run: |
          cargo llvm-cov --locked --ignore-filename-regex 'main\.rs' \
            --fail-under-lines 82 --fail-under-regions 80 --fail-under-functions 88

  lint-scripts-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck and shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      # Discovered by shebang rather than listed by name, so a shell script
      # added under scripts/ or examples/scripts/ is linted automatically
      # instead of silently escaping both checks. Selecting by shebang (not
      # by directory) is what keeps the one Python script in scripts/ out of
      # it -- that has its own black/ruff steps below.
      - name: Find shell scripts
        id: shell-scripts
        run: |
          set -euo pipefail
          files="$(grep -rlE '^#!/bin/sh' scripts examples/scripts | sort | tr '\n' ' ')"
          test -n "$files" || { echo "::error::no shell scripts found to lint"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Linting: $files"

      - name: shellcheck
        run: shellcheck --shell=sh ${{ steps.shell-scripts.outputs.files }}

      - name: shfmt
        run: shfmt -i 2 -d ${{ steps.shell-scripts.outputs.files }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: black --check
        run: uv run black --check scripts/generate-layout-screenshots

      - name: ruff check
        run: uv run ruff check scripts/generate-layout-screenshots

  live-sway-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install sway and foot
        run: sudo apt-get update && sudo apt-get install -y sway foot

      - name: Run live-Sway tests
        run: ./scripts/run-live-sway-tests

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        uses: actions-rust-lang/audit@v1.2.7
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
