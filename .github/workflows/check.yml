name: Check

# Runs on every push and pull request: formatting, lint, the full test
# suite, and a dependency security audit must all pass before a change is
# considered clean, matching the checks CLAUDE.md requires before a commit.
on:
  push:
  pull_request:

# None of these jobs writes anything to the repository -- they check out this
# repo's own code, lint it and test it. Declared here rather than left to the
# repository default, which on a repo created before GitHub changed that
# default (or with it set permissively) hands every job a read/write token it
# has no use for. The audit job below re-declares its own, since it does need
# issues: write. Mirrors release.yml, where the same scoping already applies.
#
# Every third-party action is pinned to a full commit SHA, with the tag it
# corresponds to in a trailing comment, rather than a movable tag or branch:
# a retargeted tag would otherwise run new code here, including in the audit
# job's issues: write token. .github/dependabot.yml keeps the pins current.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt --check
        run: cargo fmt -- --check

      # --all-features matters: tests/live_sway.rs is behind
      # #![cfg(feature = "live-sway-tests")], so without it that file compiles
      # to nothing and clippy lints none of its ~4,000 lines -- the one file
      # CLAUDE.md insists must stay complete, silently exempt from the lint
      # gate. Clippy needs no compositor, only the cfg flag.
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov

      # Excluded by filename: main.rs (CLI wiring, covered by the tests/
      # integration suites), ipc.rs and query.rs (compositor-bound, covered by
      # tests/live_sway.rs instead -- see CLAUDE.md's Rust conventions), and
      # the unit-test files themselves (test_support.rs and every */tests.rs),
      # so tests can't count as covered production code. Thresholds sit a few
      # points under the baseline measured 2026-10-12 (72.16% regions, 71.56%
      # lines, 80.95% functions, 28 of 147 uncovered); most of the gap is the
      # IPC-touching run_* drivers in confirmation.rs and launch.rs.
      - name: cargo llvm-cov (coverage regression gate)
        run: |
          cargo llvm-cov --locked --ignore-filename-regex '(^|/)(main|ipc|query|test_support|tests)\.rs$' \
            --fail-under-lines 68 --fail-under-regions 68 --fail-under-functions 77

  lint-scripts-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck and shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      # Discovered by shebang rather than listed by name, so a shell script
      # added under scripts/ or examples/scripts/ is linted automatically
      # instead of silently escaping both checks. Selecting by shebang (not
      # by directory) is what keeps the one Python script in scripts/ out of
      # it -- that has its own black/ruff steps below.
      #
      # The pattern matches any sh/bash/dash shebang, not just the literal
      # `#!/bin/sh` every current script uses: a review pointed out that a
      # script added with `#!/usr/bin/env sh` would have matched neither the
      # old pattern nor anything else, and escaped both checks silently --
      # exactly what discovering by shebang is meant to prevent.
      - name: Find shell scripts
        id: shell-scripts
        run: |
          set -euo pipefail
          files="$(grep -rlE '^#!.*[ /](sh|bash|dash)$' scripts examples/scripts | sort | tr '\n' ' ')"
          test -n "$files" || { echo "::error::no shell scripts found to lint"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Linting: $files"

      - name: shellcheck
        run: shellcheck --shell=sh ${{ steps.shell-scripts.outputs.files }}

      - name: shfmt
        run: shfmt -i 2 -d ${{ steps.shell-scripts.outputs.files }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: black --check
        run: uv run --group dev black --check scripts/generate-layout-screenshots

      - name: ruff check
        run: uv run --group dev ruff check scripts/generate-layout-screenshots

  live-sway-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install sway and foot
        run: sudo apt-get update && sudo apt-get install -y sway foot

      - name: Run live-Sway tests
        run: ./scripts/run-live-sway-tests

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Nothing after checkout needs git credentials (the audit action gets
      # its token through TOKEN), so don't leave this job's token on disk.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: cargo audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
