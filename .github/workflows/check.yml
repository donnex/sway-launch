name: Check

# Runs on every push and pull request: formatting, lint, the full test
# suite, and a dependency security audit must all pass before a change is
# considered clean, matching the checks CLAUDE.md requires before a commit.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Thresholds are calibrated to this project's actual measured baseline
      # (81.46% regions / 82.84% lines as of 2026-08-20), not an arbitrary
      # round number: sway_launch.rs's IPC-touching functions are
      # deliberately exempted from unit-test coverage (see CLAUDE.md's Rust
      # conventions -- they're exercised by tests/live_sway.rs instead,
      # which this job can't run headlessly), so a flat 90%+ target isn't
      # the right bar here the way it might be for a project with no such
      # exemption list. This gate exists to catch a *regression* (new
      # pure-logic code added with no test) against the known baseline, not
      # to enforce an idealized number.
      - name: cargo llvm-cov (coverage regression gate, excluding main.rs)
        run: |
          cargo llvm-cov --locked --ignore-filename-regex 'main\.rs' \
            --fail-under-lines 82 --fail-under-regions 80 --fail-under-functions 90

  lint-scripts-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck and shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: shellcheck
        run: shellcheck --shell=sh scripts/run-live-sway-tests examples/scripts/*

      - name: shfmt
        run: shfmt -i 2 -d scripts/run-live-sway-tests examples/scripts/*

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: black --check
        run: uv run black --check scripts/generate-layout-screenshots

      - name: ruff check
        run: uv run ruff check scripts/generate-layout-screenshots

  live-sway-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install sway and foot
        run: sudo apt-get update && sudo apt-get install -y sway foot

      - name: Run live-Sway tests
        run: ./scripts/run-live-sway-tests

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        uses: actions-rust-lang/audit@v1.2.7
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
