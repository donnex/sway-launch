name: Check

# Runs on every push and pull request: scripts/run-checks (formatting, lint,
# build and the full headless test suite), the coverage gate, the minimum
# Rust version build, the live-Sway tests (on Sway 1.9 and on the newest
# release) and a dependency security audit must all pass before a change is
# considered clean.
on:
  push:
  pull_request:

# None of these jobs writes anything to the repository -- they check out this
# repo's own code, lint it and test it. Declared here rather than left to the
# repository default, which on a repo created before GitHub changed that
# default (or with it set permissively) hands every job a read/write token it
# has no use for. The audit job below re-declares its own, since it does need
# issues: write. Mirrors release.yml, where the same scoping already applies.
#
# Every third-party action is pinned to a full commit SHA, with the tag it
# corresponds to in a trailing comment, rather than a movable tag or branch:
# a retargeted tag would otherwise run new code here, including in the audit
# job's issues: write token. .github/dependabot.yml keeps the pins current.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Taken from whatever the runner image's apt ships rather than pinned,
      # so the versions are printed instead: a new finding that appears on a
      # commit that touched no script can then be traced to a tool upgrade
      # from the log alone.
      - name: Install shellcheck and shfmt
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck shfmt
          shellcheck --version
          echo "shfmt $(shfmt --version)"

      # Pinned because rules are added and tightened between releases, which
      # would otherwise turn this job red without any Markdown changing. Keep
      # the version in CLAUDE.md's Commands section in step.
      - name: Install markdownlint
        run: npm install -g markdownlint-cli@0.49.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The checks every commit must pass, in one script shared with
      # release.yml and with developers, so a new check is added in one place:
      # fmt, clippy (--all-targets --all-features: without the feature,
      # tests/live_sway.rs compiles to nothing and goes unlinted), build,
      # test, shellcheck/shfmt on every shell script found by shebang,
      # markdownlint on every tracked Markdown file, the CHANGELOG.md release
      # shape (scripts/check-changelog), and black/ruff.
      - name: Run checks
        run: ./scripts/run-checks

      # Pinned, not left at install-action's default of "latest": the gate
      # below is tuned to a few points under a measured baseline, and a
      # release that counts regions or lines differently could move the
      # numbers past that headroom on a commit that changed no code. Bump it
      # deliberately, re-measuring the baseline in the same change, and keep
      # the version in CLAUDE.md's Commands section in step.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1

      # Excluded by filename: main.rs (Args, dispatch and output, covered by
      # the tests/ integration suites; the --layout/--template run itself is
      # in run.rs, which is measured, #134) and the unit-test files
      # themselves (test_support.rs and every */tests.rs), so tests can't
      # count as covered production code. The IPC layers (ipc.rs, query.rs)
      # are measured: tests/fake_sway.rs drives them against a fake
      # compositor (#103). Thresholds were set a few points under the
      # baseline measured 2026-10-17 (90.58% regions, 92.20% lines, 91.81%
      # functions) and left there when run.rs joined the measured set;
      # re-measured 2026-10-18 with it: 92.34% regions, 94.44% lines, 92.18%
      # functions. Most of the gap is IPC-error branches and launch.rs's
      # debug-events loop.
      - name: cargo llvm-cov (coverage regression gate)
        run: |
          cargo llvm-cov --locked --ignore-filename-regex '(^|/)(main|test_support|tests)\.rs$' \
            --fail-under-lines 88 --fail-under-regions 86 --fail-under-functions 87

  # Builds the shipped binary with the toolchain Cargo.toml's rust-version
  # declares, so that floor can't silently drift past what a dependency bump
  # or a newly used std API actually needs. Builds only, deliberately: the
  # test suites use std::io::pipe (stable since 1.87), and the declared floor
  # is a promise about building sway-launch, not about running its tests.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
          test -n "$version" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build with the declared minimum Rust version
        run: cargo +${{ steps.msrv.outputs.version }} build --locked

  # The oldest Sway this project supports: Ubuntu 24.04's archive ships 1.9.
  # Pinned to that image rather than ubuntu-latest, so a runner image update
  # can't silently move this job to a newer Sway and leave the 1.9
  # workarounds untested. Kept apart from check so a live-Sway hiccup doesn't
  # block the fast unit-test feedback loop.
  live-sway-1-9:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install sway and foot
        run: sudo apt-get update && sudo apt-get install -y sway foot

      - name: Run live-Sway tests
        run: ./scripts/run-live-sway-tests

  # The newest Sway: Arch Linux is a rolling distribution, so this tests
  # whatever Sway release is current. Unpinned on purpose;
  # run-live-sway-tests prints the version, so a failure after a Sway
  # release can be told from a code regression. Rust comes from Arch's own
  # package, which tracks the latest stable release. foot needs a font to
  # start, which the base image lacks. Arch's sway binary carries the
  # cap_sys_nice file capability, and a container without that capability
  # can't exec it at all ("Operation not permitted"), so it's granted here.
  live-sway-latest:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --cap-add=SYS_NICE
    steps:
      - name: Install sway, foot and Rust
        run: pacman -Syu --noconfirm --needed sway foot ttf-dejavu rust gcc

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run live-Sway tests
        run: ./scripts/run-live-sway-tests

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Nothing after checkout needs git credentials (the audit action gets
      # its token through TOKEN), so don't leave this job's token on disk.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: cargo audit
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
