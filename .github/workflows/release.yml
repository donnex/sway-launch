name: Release

# Push a tag like "v0.2.0" to trigger a build + GitHub release with a
# sway-launch-<tag>-x86_64-unknown-linux-musl.tar.gz (binary, README.md,
# LICENSE, man page and bash/zsh/fish completions) and
# its .sha256 checksum attached. Only the Linux x86_64 target, matching the
# runner's own platform. Uses the `GITHUB_TOKEN` GitHub Actions injects
# automatically for every run rather than requiring a manually-created
# secret.
#
# Every third-party action is pinned to a full commit SHA, with the tag it
# corresponds to in a trailing comment, rather than a movable tag or branch:
# a retargeted tag would otherwise run new code against the release itself.
# .github/dependabot.yml keeps the pins current.
on:
  push:
    tags:
      - "v*"

# Read-only by default, rather than left to the repository default (which may
# hand every job a read/write token). Only the publish job re-declares
# contents: write; a job added here later starts read-only unless it asks for
# more on its own.
permissions:
  contents: read

jobs:
  # Runs scripts/run-checks, as check.yml does, against the exact tagged
  # commit, so a release can't ship from a commit that never passed CI (e.g.
  # a tag pushed before check.yml ran, or pointing at an older commit).
  check:
    runs-on: ubuntu-latest
    # Only the publish job below writes anything; this one just runs checks.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # A tag pushed without the version-bump commit, or on the wrong commit,
      # would otherwise still publish (as long as CHANGELOG.md had a matching
      # section), shipping a binary whose --version disagrees with its
      # release name.
      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "sway-launch") | .version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag version $tag_version does not match Cargo.toml version $cargo_version" >&2
            exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Versions printed, not pinned -- see check.yml's matching step.
      - name: Install shellcheck and shfmt
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y shellcheck shfmt
          shellcheck --version
          echo "shfmt $(shfmt --version)"

      # Pinned to the same version as check.yml -- see the comment there.
      - name: Install markdownlint
        run: npm install -g markdownlint-cli@0.49.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      # The same script check.yml runs -- see the comment there.
      - name: Run checks
        run: ./scripts/run-checks

  # Builds and packages the release with a read-only token. Building runs
  # third-party code -- every dependency's build script and proc-macro -- so
  # this job never holds the write token: if it did, any of that code could
  # read it (checkout leaves its token on disk by default) and tamper with the
  # release. The publish job below gets contents: write and runs nothing but
  # gh.
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The tag name reaches every step below through the environment rather
    # than being expanded into a shell script by ${{ }}. Git ref names permit
    # `$`, backticks, `;` and parentheses, so an interpolated tag is shell
    # source -- reachable only by someone who can already push a tag here,
    # but the env-var form costs nothing and removes the question.
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      # musl rather than the runner's default glibc target, so the binary is
      # statically linked and runs on any x86_64 Linux, not only on one whose
      # glibc is at least as new as the runner's. The crate has no C
      # dependencies and Rust's musl target ships its own C runtime, so no
      # musl-tools package is needed.
      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      # The man page comes from a separate build with the generate-man
      # feature, so the shipped binary carries no man page generator. The
      # completions come from the shipped binary itself.
      - name: Generate man page and shell completions
        run: |
          set -euo pipefail
          mkdir -p dist/extras/completions
          cargo run --locked --features generate-man -- --generate-man > dist/extras/sway-launch.1
          binary=target/x86_64-unknown-linux-musl/release/sway-launch
          "$binary" --completions bash > dist/extras/completions/sway-launch.bash
          "$binary" --completions zsh > dist/extras/completions/_sway-launch
          "$binary" --completions fish > dist/extras/completions/sway-launch.fish

      # The archive name carries the version/platform detail; the binary
      # inside it stays plain `sway-launch` so extracting it needs no
      # renaming. Assigned as an ordinary shell variable rather than read back
      # from $GITHUB_ENV with `source`: sourcing that file executes it as
      # shell, which would have made an interpolated tag name executable at
      # exactly the point this is trying to be careful about. LICENSE ships
      # alongside the binary because BSD-3-Clause requires binary
      # redistributions to reproduce the copyright notice and conditions.
      - name: Package release archive
        run: |
          set -euo pipefail
          ARCHIVE_NAME="sway-launch-${REF_NAME}-x86_64-unknown-linux-musl"

          mkdir -p "dist/$ARCHIVE_NAME"
          cp target/x86_64-unknown-linux-musl/release/sway-launch "dist/$ARCHIVE_NAME/sway-launch"
          cp README.md "dist/$ARCHIVE_NAME/"
          cp LICENSE "dist/$ARCHIVE_NAME/"
          cp dist/extras/sway-launch.1 "dist/$ARCHIVE_NAME/"
          cp -r dist/extras/completions "dist/$ARCHIVE_NAME/"
          chmod +x "dist/$ARCHIVE_NAME/sway-launch"
          tar -C dist -czf "dist/$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          (cd dist && sha256sum "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256")

      # Release notes come from CHANGELOG.md rather than gh's own
      # auto-generated (PR-title-based) notes, so they match what
      # CLAUDE.md's Changelog section already requires every user-facing
      # change to carry. Failing when the section is missing/empty doubles
      # as a check that the version-bump commit actually finalized it.
      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi
          cat dist/release-notes.md

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      # No checkout here, so gh is told the repository explicitly.
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARCHIVE_NAME="sway-launch-${REF_NAME}-x86_64-unknown-linux-musl"
          gh release create "$REF_NAME" \
            "dist/$ARCHIVE_NAME.tar.gz" \
            "dist/$ARCHIVE_NAME.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$REF_NAME" \
            --notes-file dist/release-notes.md
