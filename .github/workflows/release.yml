name: Release

# Push a tag like "v0.2.0" to trigger a build + GitHub release with a
# sway-launch-<tag>-x86_64-unknown-linux-gnu.tar.gz (binary + README.md) and
# its .sha256 checksum attached. Only the Linux x86_64 target, matching the
# runner's own platform. Uses the `GITHUB_TOKEN` GitHub Actions injects
# automatically for every run rather than requiring a manually-created
# secret.
on:
  push:
    tags:
      - "v*"

jobs:
  # Mirrors check.yml's checks against the exact tagged commit, so a release
  # can't ship from a commit that never passed CI (e.g. a tag pushed before
  # check.yml ran, or pointing at an older commit).
  check:
    runs-on: ubuntu-latest
    # Only the release job below writes anything; this one just runs checks.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: cargo test
        run: cargo test --locked

      - name: Install shellcheck and shfmt
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      # Kept identical to check.yml's own discovery step — see the comment
      # there for why the list isn't hardcoded.
      - name: Find shell scripts
        id: shell-scripts
        run: |
          set -euo pipefail
          files="$(grep -rlE '^#!/bin/sh' scripts examples/scripts | sort | tr '\n' ' ')"
          test -n "$files" || { echo "::error::no shell scripts found to lint"; exit 1; }
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Linting: $files"

      - name: shellcheck
        run: shellcheck --shell=sh ${{ steps.shell-scripts.outputs.files }}

      - name: shfmt
        run: shfmt -i 2 -d ${{ steps.shell-scripts.outputs.files }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: markdownlint
        run: markdownlint '**/*.md'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: black --check
        run: uv run black --check scripts/generate-layout-screenshots

      - name: ruff check
        run: uv run ruff check scripts/generate-layout-screenshots

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The tag name reaches every step below through the environment rather
    # than being expanded into a shell script by ${{ }}. Git ref names permit
    # `$`, backticks, `;` and parentheses, so an interpolated tag is shell
    # source -- reachable only by someone who can already push a tag here,
    # but the env-var form costs nothing and removes the question.
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      # The archive name carries the version/platform detail; the binary
      # inside it stays plain `sway-launch` so extracting it needs no
      # renaming. ARCHIVE_NAME is published to $GITHUB_ENV so the upload step
      # below doesn't repeat the same string — but it's also assigned
      # normally here, rather than read back with `source "$GITHUB_ENV"`.
      # Sourcing that file executes it as shell, which would have made an
      # interpolated tag name executable at exactly the point this is trying
      # to be careful about.
      - name: Package release archive
        run: |
          set -euo pipefail
          ARCHIVE_NAME="sway-launch-${REF_NAME}-x86_64-unknown-linux-gnu"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

          mkdir -p "dist/$ARCHIVE_NAME"
          cp target/release/sway-launch "dist/$ARCHIVE_NAME/sway-launch"
          cp README.md "dist/$ARCHIVE_NAME/"
          chmod +x "dist/$ARCHIVE_NAME/sway-launch"
          tar -C dist -czf "dist/$ARCHIVE_NAME.tar.gz" "$ARCHIVE_NAME"
          (cd dist && sha256sum "$ARCHIVE_NAME.tar.gz" > "$ARCHIVE_NAME.tar.gz.sha256")

      # Release notes come from CHANGELOG.md rather than gh's own
      # auto-generated (PR-title-based) notes, so they match what
      # CLAUDE.md's Changelog section already requires every user-facing
      # change to carry. Failing when the section is missing/empty doubles
      # as a check that the version-bump commit actually finalized it.
      - name: Extract changelog section for this version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $version" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$REF_NAME" \
            "dist/$ARCHIVE_NAME.tar.gz" \
            "dist/$ARCHIVE_NAME.tar.gz.sha256" \
            --title "$REF_NAME" \
            --notes-file release-notes.md
